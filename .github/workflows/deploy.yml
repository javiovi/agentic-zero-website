name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add VPS to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      run: |
        # Create deployment directory if it doesn't exist
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}"

        # Sync files to VPS (excluding node_modules and .git)
        rsync -avz --delete \
          --exclude 'node_modules' \
          --exclude '.git' \
          --exclude '.env.local' \
          --exclude '.next/cache' \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

    - name: Install dependencies on VPS and restart services
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_PATH }}

          # Install dependencies
          npm ci --production

          # Check if this is a Next.js app or static site
          if [ -f "package.json" ] && grep -q '"start"' package.json; then
            echo "Detected Node.js application - managing with PM2"

            # Stop existing PM2 process if running
            pm2 delete agenticzero || true

            # Start new process with PM2
            pm2 start npm --name "agenticzero" -- start
            pm2 save

            # Setup PM2 startup script (only needs to be done once)
            sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u deploy --hp /home/deploy || true

          else
            echo "Detected static site - files deployed successfully"

            # If using nginx, reload configuration
            if command -v nginx &> /dev/null; then
              sudo systemctl reload nginx || echo "Could not reload nginx - may need manual configuration"
            fi
          fi

          echo "Deployment completed successfully!"
        EOF

    - name: Verify deployment
      run: |
        # Test if the site is accessible
        response=$(curl -s -o /dev/null -w "%{http_code}" http://agenticzero.xyz || echo "000")
        if [ "$response" = "200" ]; then
          echo "✅ Deployment successful - Site is accessible"
        else
          echo "⚠️ Deployment completed but site returned HTTP $response"
          echo "Check your nginx configuration and PM2 status"
        fi